[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-specific-rag"
version = "0.1.0"
description = "Local research assistant with hybrid retrieval and source-validated Codex answers"
requires-python = ">=3.11"
dependencies = [
    "openai-codex==0.163.0",
    "langchain-core==1.7.4",
    "langsmith==0.14.17",
    "pydantic==2.14.2",
    "streamlit==1.66.1",
    "pymupdf==2.1",
    "llama-index-core==0.14.25",
    "llama-index-vector-stores-chroma==0.6.0",
    "llama-index-embeddings-huggingface==0.8.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",
    "rank-bm25==0.2.2",
    "joblib==1.6.0",
    "filelock==4.2.7",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
rag-verify-codex = "src.verification:main"
rag-verify-rag = "src.phase3_verification:main"
rag-verify-comparison = "src.phase4_verification:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
